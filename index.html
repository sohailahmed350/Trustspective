<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustspective | Independent AI Governance & Ethics Advisory</title>
    <style>
        :root {
            /* Premium EMIR-inspired Gold */
            --accent: #C49A45; 
            --accent-hover: #A67C33;
            
            /* Dark Theme Variables */
            --dark-bg: #000000;
            --dark-surface: #0a0a0a;
            --dark-border: #222222;
            --dark-text: #ffffff;
            --dark-muted: #a0a0a0;

            /* Light Theme Variables */
            --light-bg: #ffffff;
            --light-surface: #f9f9f9;
            --light-border: #d0d0d0;
            --light-text: #000000;
            --light-muted: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Alternating Backgrounds */
        .section-dark {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }
        
        .section-light {
            background-color: var(--light-bg);
            color: var(--light-text);
        }

        /* Navigation (Dark) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
            border-bottom: 1px solid var(--dark-border);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--dark-text);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--dark-muted);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Buttons */
        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            padding: 0.85rem 2rem;
            border-radius: 0; /* Square edges for premium feel */
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-outline:hover {
            background-color: var(--accent);
            color: #ffffff;
        }

        /* Hero Section (Dark) */
        header {
            padding: 8rem 0 6rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: -1px;
            line-height: 1.15;
            max-width: 900px;
            margin-bottom: 2rem;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--dark-muted);
            max-width: 700px;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* General Sections */
        section {
            padding: 6rem 0;
        }

        .section-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .section-header::before {
            content: "";
            display: block;
            width: 40px;
            height: 1px;
            background-color: var(--accent);
        }

        /* About Section (Light) */
        .about-text h2 {
            font-size: 2.25rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: var(--light-text);
            line-height: 1.3;
        }
        
        .about-text p {
            font-size: 1.15rem;
            color: var(--light-muted);
            max-width: 900px;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Services Grid (Dark) */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background-color: var(--dark-surface);
            padding: 3rem 2.5rem;
            border: 1px solid var(--dark-border);
            border-top: 2px solid var(--accent);
            transition: transform 0.3s, background-color 0.3s;
        }
        
        .service-card:hover {
            background-color: #111111;
            transform: translateY(-5px);
        }

        .service-card h3 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            color: var(--dark-text);
        }

        .service-card p {
            color: #e0e0e0;
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* Contact Section (Light) */
        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
        }

        .contact-text h2 {
            font-size: 2.25rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            color: var(--light-text);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Premium Form Styling */
        input, textarea {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid var(--light-border);
            color: var(--light-text);
            padding: 1rem 0;
            font-size: 1rem;
            width: 100%;
            border-radius: 0;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }
        
        input::placeholder, textarea::placeholder {
            color: var(--light-muted);
            font-weight: 300;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        footer {
            padding: 4rem 0;
            text-align: center;
            color: var(--dark-muted);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 1px;
            border-top: 1px solid var(--dark-border);
        }

        @media (max-width: 768px) {
            .contact-layout {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2.5rem;
            }
            .nav-links {
                display: none;
            }
            section {
                padding: 4rem 0;
            }
            header {
                padding: 5rem 0 4rem;
            }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION (DARK) -->
    <div class="section-dark">
        <div class="container">
            <nav>
                <div class="logo">Trust
